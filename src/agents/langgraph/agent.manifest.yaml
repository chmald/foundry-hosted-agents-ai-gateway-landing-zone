name: agent-langgraph
description: >
  LangGraph hosted agent that routes model and MCP tool calls through the configured gateway.
metadata:
  tags:
    - LangChain
    - LangGraph
    - AI Agent Hosting
    - Responses Protocol
    - MCP
template:
  name: agent-langgraph
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: MODEL_DEPLOYMENT_NAME
      value: "{{MODEL_DEPLOYMENT_NAME}}"
    - name: HOSTED_DEFAULT_GATEWAY
      value: "{{AGENT_DEFAULT_GATEWAY}}"
resources:
  - kind: model
    id: gpt-5.5
    name: MODEL_DEPLOYMENT_NAME
